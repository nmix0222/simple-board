<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>간단 게시판</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e4e9;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 20px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
  }
  main {
    max-width: 720px;
    margin: 24px auto;
    padding: 0 16px 60px;
  }
  .write-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .write-box h2 {
    margin: 0 0 12px;
    font-size: 16px;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  textarea {
    min-height: 90px;
    resize: vertical;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 13px;
  }
  .post {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .post-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .post-title {
    font-size: 16px;
    font-weight: 700;
    word-break: break-word;
  }
  .post-meta {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    margin-left: 10px;
  }
  .post-body {
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    color: #374151;
  }
  .post-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }
  .post-author {
    font-size: 12px;
    color: var(--muted);
  }
  .btn-delete {
    background: transparent;
    color: var(--danger);
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 500;
  }
  .btn-delete:hover {
    text-decoration: underline;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 14px;
  }
  select {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
    max-width: 140px;
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .tab {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .tab:hover {
    border-color: var(--accent);
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .post-category {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: #eaf0ff;
    border-radius: 4px;
    padding: 2px 6px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .auth-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .auth-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
  }
  .auth-tab {
    flex: 1;
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 8px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
  }
  .auth-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .auth-panel .row:last-child {
    margin-bottom: 0;
  }
  .auth-hint {
    font-size: 12px;
    color: var(--muted);
    margin: 4px 2px 8px;
  }
  .user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .btn-secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: #ebedf0;
  }
  .login-required {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 10px 0;
  }
  .color-picker {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .color-swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border);
    padding: 0;
    cursor: pointer;
  }
  .color-swatch.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.3);
  }
</style>
</head>
<body>
<header>
  <h1>📋 간단 게시판</h1>
</header>
<main>
  <div id="authSection"></div>

  <section class="write-box" id="writeBox">
    <h2>글쓰기</h2>
    <div class="row">
      <select id="categoryInput"></select>
    </div>
    <div class="row">
      <input type="text" id="titleInput" placeholder="제목">
    </div>
    <div class="row">
      <textarea id="contentInput" placeholder="내용을 입력하세요"></textarea>
    </div>
    <div class="actions">
      <button class="btn-primary" onclick="addPost()">등록</button>
    </div>
  </section>

  <div class="tabs" id="tabList"></div>

  <div class="list-header">
    <span id="countLabel">0개의 글</span>
  </div>
  <section id="postList"></section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    onSnapshot,
    query,
    orderBy,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC56fDWIpbORE_RyCrCS6zxzzfLddC9Njc",
    authDomain: "simple-board-8b064.firebaseapp.com",
    projectId: "simple-board-8b064",
    storageBucket: "simple-board-8b064.firebasestorage.app",
    messagingSenderId: "199343169394",
    appId: "1:199343169394:web:d89f8f684155058165c7eb",
    measurementId: "G-GKMDX9NN0W"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);

  const CATEGORIES = ['자유', '연예인', '개그', '유머', '스포츠', '게임', '영화/드라마', '음악', 'IT', '질문'];
  const POST_COLORS = ['#ffffff', '#fff4cc', '#ffe0e6', '#dbeafe', '#dcfce7', '#f3e8ff', '#ffedd5', '#e0f2fe'];
  let currentCategory = '전체';
  let authTab = 'login';
  let currentUser = null; // { uid, username }
  let allPosts = [];
  let selectedColor = POST_COLORS[0];

  // Firebase email/password auth needs an email; users only pick a "username",
  // so map it to a deterministic fake address instead of exposing an email field.
  function usernameToEmail(username) {
    const encoded = btoa(unescape(encodeURIComponent(username)))
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=/g, '');
    return `${encoded}@simple-board.local`;
  }

  function getCurrentUser() {
    return currentUser ? currentUser.username : null;
  }

  function renderAuth() {
    const authSection = document.getElementById('authSection');
    const currentUser = getCurrentUser();

    if (currentUser) {
      authSection.innerHTML = `
        <div class="user-bar">
          <span><strong>${escapeHtml(currentUser)}</strong>님 환영합니다</span>
          <button class="btn-secondary" onclick="doLogout()">로그아웃</button>
        </div>
      `;
    } else {
      authSection.innerHTML = `
        <div class="auth-box">
          <div class="auth-tabs">
            <button type="button" class="auth-tab${authTab === 'login' ? ' active' : ''}" data-tab="login">로그인</button>
            <button type="button" class="auth-tab${authTab === 'signup' ? ' active' : ''}" data-tab="signup">회원가입</button>
          </div>
          <div class="auth-panel" style="display:${authTab === 'login' ? 'block' : 'none'}">
            <div class="row">
              <input type="text" id="loginUsername" placeholder="아이디">
            </div>
            <div class="row">
              <input type="password" id="loginPassword" placeholder="비밀번호">
            </div>
            <div class="actions">
              <button class="btn-primary" onclick="doLogin()">로그인</button>
            </div>
          </div>
          <div class="auth-panel" style="display:${authTab === 'signup' ? 'block' : 'none'}">
            <div class="row">
              <input type="text" id="signupUsername" placeholder="아이디 (2자 이상)">
            </div>
            <div class="row">
              <input type="password" id="signupPassword" placeholder="비밀번호 (4자 이상)">
            </div>
            <div class="auth-hint">※ 계정은 Firebase에 저장되며, 다른 브라우저/기기에서도 로그인할 수 있습니다.</div>
            <div class="actions">
              <button class="btn-primary" onclick="doSignup()">가입하기</button>
            </div>
          </div>
        </div>
      `;
      authSection.querySelectorAll('.auth-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          authTab = btn.dataset.tab;
          renderAuth();
        });
      });
    }

    updateWriteBoxVisibility();
  }

  function updateWriteBoxVisibility() {
    const writeBox = document.getElementById('writeBox');
    const currentUser = getCurrentUser();
    if (currentUser) {
      writeBox.innerHTML = `
        <h2>글쓰기 <span style="font-weight:400;font-size:13px;color:var(--muted);">(${escapeHtml(currentUser)})</span></h2>
        <div class="row">
          <select id="categoryInput"></select>
        </div>
        <div class="row">
          <input type="text" id="titleInput" placeholder="제목">
        </div>
        <div class="row">
          <textarea id="contentInput" placeholder="내용을 입력하세요"></textarea>
        </div>
        <div class="row color-picker" id="colorPicker"></div>
        <div class="actions">
          <button class="btn-primary" onclick="addPost()">등록</button>
        </div>
      `;
      initCategorySelect();
      renderColorPicker();
    } else {
      writeBox.innerHTML = `
        <h2>글쓰기</h2>
        <div class="login-required">로그인 후 글을 작성할 수 있습니다.</div>
      `;
    }
  }

  async function doSignup() {
    const usernameInput = document.getElementById('signupUsername');
    const passwordInput = document.getElementById('signupPassword');
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (username.length < 2) {
      alert('아이디는 2자 이상 입력해주세요.');
      return;
    }
    if (password.length < 4) {
      alert('비밀번호는 4자 이상 입력해주세요.');
      return;
    }

    try {
      const cred = await createUserWithEmailAndPassword(auth, usernameToEmail(username), password);
      await updateProfile(cred.user, { displayName: username });
      currentUser = { uid: cred.user.uid, username };
      renderAuth();
      render();
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') {
        alert('이미 존재하는 아이디입니다.');
      } else {
        alert('회원가입에 실패했습니다: ' + e.message);
      }
    }
  }

  async function doLogin() {
    const usernameInput = document.getElementById('loginUsername');
    const passwordInput = document.getElementById('loginPassword');
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    try {
      const cred = await signInWithEmailAndPassword(auth, usernameToEmail(username), password);
      currentUser = { uid: cred.user.uid, username: cred.user.displayName || username };
      renderAuth();
      render();
    } catch (e) {
      if (['auth/invalid-credential', 'auth/user-not-found', 'auth/wrong-password'].includes(e.code)) {
        alert('아이디 또는 비밀번호가 일치하지 않습니다.');
      } else {
        alert('로그인에 실패했습니다: ' + e.message);
      }
    }
  }

  async function doLogout() {
    await signOut(auth);
    currentUser = null;
    renderAuth();
    render();
  }

  function initCategorySelect() {
    const select = document.getElementById('categoryInput');
    select.innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  function renderColorPicker() {
    const picker = document.getElementById('colorPicker');
    if (!picker) return;
    picker.innerHTML = POST_COLORS
      .map(c => `<button type="button" class="color-swatch${c === selectedColor ? ' selected' : ''}" data-color="${c}" style="background:${c}" title="글 색상"></button>`)
      .join('');
    picker.querySelectorAll('.color-swatch').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedColor = btn.dataset.color;
        picker.querySelectorAll('.color-swatch').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });
  }

  function initTabs() {
    const tabList = document.getElementById('tabList');
    const all = ['전체', ...CATEGORIES];
    tabList.innerHTML = all
      .map(c => `<button type="button" class="tab${c === currentCategory ? ' active' : ''}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`)
      .join('');
    tabList.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        currentCategory = btn.dataset.category;
        initTabs();
        render();
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(ts) {
    if (!ts) return '방금 전';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function render() {
    const filtered = currentCategory === '전체'
      ? allPosts
      : allPosts.filter(p => p.category === currentCategory);
    const list = document.getElementById('postList');
    const countLabel = document.getElementById('countLabel');
    countLabel.textContent = `${filtered.length}개의 글`;

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">아직 등록된 글이 없습니다.</div>';
      return;
    }

    list.innerHTML = filtered
      .map(post => `
        <article class="post" style="${post.color && post.color !== '#ffffff' ? `background:${post.color}` : ''}">
          <div class="post-top">
            <div class="post-title"><span class="post-category">${escapeHtml(post.category || '자유')}</span>${escapeHtml(post.title)}</div>
            <div class="post-meta">${formatDate(post.createdAt)}</div>
          </div>
          <div class="post-body">${escapeHtml(post.content)}</div>
          <div class="post-footer">
            <span class="post-author">${escapeHtml(post.author || '익명')}</span>
            ${currentUser && post.authorUid === currentUser.uid ? `<button class="btn-delete" onclick="deletePost('${post.id}')">삭제</button>` : ''}
          </div>
        </article>
      `)
      .join('');
  }

  async function addPost() {
    if (!currentUser) {
      alert('로그인 후 이용해주세요.');
      return;
    }

    const categoryInput = document.getElementById('categoryInput');
    const titleInput = document.getElementById('titleInput');
    const contentInput = document.getElementById('contentInput');

    const category = categoryInput.value;
    const title = titleInput.value.trim();
    const content = contentInput.value.trim();

    if (!title || !content) {
      alert('제목과 내용을 입력해주세요.');
      return;
    }

    try {
      await addDoc(collection(db, 'posts'), {
        category,
        author: currentUser.username,
        authorUid: currentUser.uid,
        title,
        content,
        color: selectedColor,
        createdAt: serverTimestamp()
      });
      titleInput.value = '';
      contentInput.value = '';
      selectedColor = POST_COLORS[0];
      renderColorPicker();
    } catch (e) {
      alert('글 등록에 실패했습니다: ' + e.message);
    }
  }

  async function deletePost(id) {
    const post = allPosts.find(p => p.id === id);
    if (!post || !currentUser || post.authorUid !== currentUser.uid) {
      alert('본인 글만 삭제할 수 있습니다.');
      return;
    }
    if (!confirm('이 글을 삭제하시겠습니까?')) return;
    try {
      await deleteDoc(doc(db, 'posts', id));
    } catch (e) {
      alert('삭제에 실패했습니다: ' + e.message);
    }
  }

  window.addPost = addPost;
  window.deletePost = deletePost;
  window.doLogin = doLogin;
  window.doSignup = doSignup;
  window.doLogout = doLogout;

  onAuthStateChanged(auth, (user) => {
    currentUser = user ? { uid: user.uid, username: user.displayName || '사용자' } : null;
    renderAuth();
    render();
  });

  onSnapshot(
    query(collection(db, 'posts'), orderBy('createdAt', 'desc')),
    (snapshot) => {
      allPosts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    },
    (error) => {
      console.error('Firestore error:', error);
    }
  );

  initTabs();
</script>
</body>
</html>
