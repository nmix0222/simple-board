<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>간단 게시판</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e4e9;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 20px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
  }
  main {
    max-width: 720px;
    margin: 24px auto;
    padding: 0 16px 60px;
  }
  .write-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .write-box h2 {
    margin: 0 0 12px;
    font-size: 16px;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  textarea {
    min-height: 90px;
    resize: vertical;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 13px;
  }
  .post {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .post-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .post-title {
    font-size: 16px;
    font-weight: 700;
    word-break: break-word;
  }
  .post-meta {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    margin-left: 10px;
  }
  .post-body {
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    color: #374151;
  }
  .post-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }
  .post-author {
    font-size: 12px;
    color: var(--muted);
  }
  .btn-delete {
    background: transparent;
    color: var(--danger);
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 500;
  }
  .btn-delete:hover {
    text-decoration: underline;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 14px;
  }
  select {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
    max-width: 140px;
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .tab {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .tab:hover {
    border-color: var(--accent);
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .post-category {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: #eaf0ff;
    border-radius: 4px;
    padding: 2px 6px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .auth-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .auth-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
  }
  .auth-tab {
    flex: 1;
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 8px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
  }
  .auth-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .auth-panel .row:last-child {
    margin-bottom: 0;
  }
  .auth-hint {
    font-size: 12px;
    color: var(--muted);
    margin: 4px 2px 8px;
  }
  .user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .btn-secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: #ebedf0;
  }
  .login-required {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 10px 0;
  }
</style>
</head>
<body>
<header>
  <h1>📋 간단 게시판</h1>
</header>
<main>
  <div id="authSection"></div>

  <section class="write-box" id="writeBox">
    <h2>글쓰기</h2>
    <div class="row">
      <select id="categoryInput"></select>
    </div>
    <div class="row">
      <input type="text" id="titleInput" placeholder="제목">
    </div>
    <div class="row">
      <textarea id="contentInput" placeholder="내용을 입력하세요"></textarea>
    </div>
    <div class="actions">
      <button class="btn-primary" onclick="addPost()">등록</button>
    </div>
  </section>

  <div class="tabs" id="tabList"></div>

  <div class="list-header">
    <span id="countLabel">0개의 글</span>
  </div>
  <section id="postList"></section>
</main>

<script>
  const STORAGE_KEY = 'simple-board-posts';
  const USERS_KEY = 'simple-board-users';
  const SESSION_KEY = 'simple-board-current-user';
  const CATEGORIES = ['자유', '연예인', '개그', '유머', '스포츠', '게임', '영화/드라마', '음악', 'IT', '질문'];
  let currentCategory = '전체';
  let authTab = 'login';

  async function hashPassword(password) {
    const data = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer))
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');
  }

  function loadUsers() {
    try {
      const raw = localStorage.getItem(USERS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveUsers(users) {
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
  }

  function getCurrentUser() {
    return localStorage.getItem(SESSION_KEY);
  }

  function setCurrentUser(username) {
    if (username) {
      localStorage.setItem(SESSION_KEY, username);
    } else {
      localStorage.removeItem(SESSION_KEY);
    }
  }

  function renderAuth() {
    const authSection = document.getElementById('authSection');
    const currentUser = getCurrentUser();

    if (currentUser) {
      authSection.innerHTML = `
        <div class="user-bar">
          <span><strong>${escapeHtml(currentUser)}</strong>님 환영합니다</span>
          <button class="btn-secondary" onclick="doLogout()">로그아웃</button>
        </div>
      `;
    } else {
      authSection.innerHTML = `
        <div class="auth-box">
          <div class="auth-tabs">
            <button type="button" class="auth-tab${authTab === 'login' ? ' active' : ''}" data-tab="login">로그인</button>
            <button type="button" class="auth-tab${authTab === 'signup' ? ' active' : ''}" data-tab="signup">회원가입</button>
          </div>
          <div class="auth-panel" style="display:${authTab === 'login' ? 'block' : 'none'}">
            <div class="row">
              <input type="text" id="loginUsername" placeholder="아이디">
            </div>
            <div class="row">
              <input type="password" id="loginPassword" placeholder="비밀번호">
            </div>
            <div class="actions">
              <button class="btn-primary" onclick="doLogin()">로그인</button>
            </div>
          </div>
          <div class="auth-panel" style="display:${authTab === 'signup' ? 'block' : 'none'}">
            <div class="row">
              <input type="text" id="signupUsername" placeholder="아이디 (2자 이상)">
            </div>
            <div class="row">
              <input type="password" id="signupPassword" placeholder="비밀번호 (4자 이상)">
            </div>
            <div class="auth-hint">※ 이 계정은 이 브라우저에만 저장됩니다. 연습/개인용으로만 사용하세요.</div>
            <div class="actions">
              <button class="btn-primary" onclick="doSignup()">가입하기</button>
            </div>
          </div>
        </div>
      `;
      authSection.querySelectorAll('.auth-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          authTab = btn.dataset.tab;
          renderAuth();
        });
      });
    }

    updateWriteBoxVisibility();
  }

  function updateWriteBoxVisibility() {
    const writeBox = document.getElementById('writeBox');
    const currentUser = getCurrentUser();
    if (currentUser) {
      writeBox.innerHTML = `
        <h2>글쓰기 <span style="font-weight:400;font-size:13px;color:var(--muted);">(${escapeHtml(currentUser)})</span></h2>
        <div class="row">
          <select id="categoryInput"></select>
        </div>
        <div class="row">
          <input type="text" id="titleInput" placeholder="제목">
        </div>
        <div class="row">
          <textarea id="contentInput" placeholder="내용을 입력하세요"></textarea>
        </div>
        <div class="actions">
          <button class="btn-primary" onclick="addPost()">등록</button>
        </div>
      `;
      initCategorySelect();
    } else {
      writeBox.innerHTML = `
        <h2>글쓰기</h2>
        <div class="login-required">로그인 후 글을 작성할 수 있습니다.</div>
      `;
    }
  }

  async function doSignup() {
    const usernameInput = document.getElementById('signupUsername');
    const passwordInput = document.getElementById('signupPassword');
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (username.length < 2) {
      alert('아이디는 2자 이상 입력해주세요.');
      return;
    }
    if (password.length < 4) {
      alert('비밀번호는 4자 이상 입력해주세요.');
      return;
    }

    const users = loadUsers();
    if (users.some(u => u.username === username)) {
      alert('이미 존재하는 아이디입니다.');
      return;
    }

    const passwordHash = await hashPassword(password);
    users.push({ username, passwordHash });
    saveUsers(users);
    setCurrentUser(username);
    renderAuth();
    render();
  }

  async function doLogin() {
    const usernameInput = document.getElementById('loginUsername');
    const passwordInput = document.getElementById('loginPassword');
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    const users = loadUsers();
    const user = users.find(u => u.username === username);
    if (!user) {
      alert('존재하지 않는 아이디입니다.');
      return;
    }

    const passwordHash = await hashPassword(password);
    if (passwordHash !== user.passwordHash) {
      alert('비밀번호가 일치하지 않습니다.');
      return;
    }

    setCurrentUser(username);
    renderAuth();
    render();
  }

  function doLogout() {
    setCurrentUser(null);
    renderAuth();
    render();
  }

  function initCategorySelect() {
    const select = document.getElementById('categoryInput');
    select.innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  function initTabs() {
    const tabList = document.getElementById('tabList');
    const all = ['전체', ...CATEGORIES];
    tabList.innerHTML = all
      .map(c => `<button type="button" class="tab${c === currentCategory ? ' active' : ''}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`)
      .join('');
    tabList.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        currentCategory = btn.dataset.category;
        initTabs();
        render();
      });
    });
  }

  function loadPosts() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function savePosts(posts) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function render() {
    const posts = loadPosts();
    const filtered = currentCategory === '전체'
      ? posts
      : posts.filter(p => p.category === currentCategory);
    const list = document.getElementById('postList');
    const countLabel = document.getElementById('countLabel');
    countLabel.textContent = `${filtered.length}개의 글`;

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">아직 등록된 글이 없습니다.</div>';
      return;
    }

    list.innerHTML = filtered
      .slice()
      .sort((a, b) => b.id - a.id)
      .map(post => `
        <article class="post">
          <div class="post-top">
            <div class="post-title"><span class="post-category">${escapeHtml(post.category || '자유')}</span>${escapeHtml(post.title)}</div>
            <div class="post-meta">${formatDate(post.id)}</div>
          </div>
          <div class="post-body">${escapeHtml(post.content)}</div>
          <div class="post-footer">
            <span class="post-author">${escapeHtml(post.author || '익명')}</span>
            ${post.author === getCurrentUser() ? `<button class="btn-delete" onclick="deletePost(${post.id})">삭제</button>` : ''}
          </div>
        </article>
      `)
      .join('');
  }

  function addPost() {
    const currentUser = getCurrentUser();
    if (!currentUser) {
      alert('로그인 후 이용해주세요.');
      return;
    }

    const categoryInput = document.getElementById('categoryInput');
    const titleInput = document.getElementById('titleInput');
    const contentInput = document.getElementById('contentInput');

    const category = categoryInput.value;
    const title = titleInput.value.trim();
    const content = contentInput.value.trim();

    if (!title || !content) {
      alert('제목과 내용을 입력해주세요.');
      return;
    }

    const posts = loadPosts();
    posts.push({
      id: Date.now(),
      category,
      author: currentUser,
      title,
      content
    });
    savePosts(posts);

    titleInput.value = '';
    contentInput.value = '';
    render();
  }

  function deletePost(id) {
    const posts = loadPosts();
    const post = posts.find(p => p.id === id);
    if (!post || post.author !== getCurrentUser()) {
      alert('본인 글만 삭제할 수 있습니다.');
      return;
    }
    if (!confirm('이 글을 삭제하시겠습니까?')) return;
    savePosts(posts.filter(p => p.id !== id));
    render();
  }

  renderAuth();
  initTabs();
  render();
</script>
</body>
</html>
